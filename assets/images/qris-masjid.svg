<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <!-- Card Background -->
  <rect width="320" height="380" rx="16" fill="#ffffff"/>
  
  <!-- QRIS Header Header Bar -->
  <rect width="320" height="60" rx="16" fill="#bf1e2e"/>
  <rect y="44" width="320" height="16" fill="#bf1e2e"/>
  
  <!-- QRIS Logo Text -->
  <text x="160" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="3">QRIS</text>
  <text x="160" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff" letter-spacing="1">QR INDONESIA STANDAR</text>

  <!-- Mosque Identifier Tag -->
  <text x="160" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a">MASJID TERASKOTA</text>
  <text x="160" y="96" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">NMID: ID102026000123456</text>

  <!-- QR Code Frame Border -->
  <rect x="35" y="110" width="250" height="250" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- QR Pattern Simulation (High precision vector blocks) -->
  <g fill="#0f172a">
    <!-- Top-Left Finder Pattern -->
    <rect x="50" y="125" width="55" height="55" rx="6"/>
    <rect x="58" y="133" width="39" height="39" rx="3" fill="#ffffff"/>
    <rect x="66" y="141" width="23" height="23" rx="2" fill="#0f172a"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="215" y="125" width="55" height="55" rx="6"/>
    <rect x="223" y="133" width="39" height="39" rx="3" fill="#ffffff"/>
    <rect x="231" y="141" width="23" height="23" rx="2" fill="#0f172a"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="50" y="290" width="55" height="55" rx="6"/>
    <rect x="58" y="298" width="39" height="39" rx="3" fill="#ffffff"/>
    <rect x="66" y="306" width="23" height="23" rx="2" fill="#0f172a"/>

    <!-- Data Blocks -->
    <rect x="120" y="125" width="10" height="20"/>
    <rect x="135" y="135" width="15" height="10"/>
    <rect x="160" y="125" width="10" height="25"/>
    <rect x="180" y="130" width="20" height="10"/>

    <rect x="115" y="155" width="25" height="10"/>
    <rect x="150" y="155" width="20" height="20"/>
    <rect x="180" y="150" width="10" height="30"/>

    <rect x="50" y="195" width="10" height="30"/>
    <rect x="70" y="200" width="20" height="10"/>
    <rect x="100" y="190" width="30" height="15"/>
    <rect x="140" y="185" width="40" height="15"/>
    <rect x="190" y="190" width="20" height="25"/>
    <rect x="220" y="190" width="20" height="10"/>
    <rect x="250" y="195" width="20" height="20"/>

    <rect x="65" y="240" width="25" height="15"/>
    <rect x="100" y="225" width="15" height="35"/>
    <rect x="125" y="220" width="25" height="20"/>
    <rect x="160" y="210" width="20" height="40"/>
    <rect x="190" y="225" width="30" height="15"/>
    <rect x="230" y="215" width="15" height="35"/>
    <rect x="255" y="230" width="15" height="25"/>

    <rect x="115" y="270" width="20" height="25"/>
    <rect x="145" y="265" width="35" height="15"/>
    <rect x="190" y="255" width="25" height="20"/>
    <rect x="225" y="260" width="20" height="20"/>
    <rect x="255" y="265" width="15" height="20"/>

    <rect x="115" y="305" width="30" height="20"/>
    <rect x="155" y="295" width="20" height="30"/>
    <rect x="185" y="285" width="20" height="40"/>
    <rect x="215" y="290" width="30" height="15"/>
    <rect x="255" y="295" width="15" height="35"/>
    <rect x="220" y="315" width="25" height="20"/>
    <rect x="125" y="335" width="30" height="15"/>
    <rect x="165" y="335" width="40" height="10"/>

    <!-- Center QRIS GPN / Security Logo -->
    <rect x="142" y="217" width="36" height="36" rx="6" fill="#bf1e2e"/>
    <polygon points="160,223 163,229 170,229 164,233 166,240 160,236 154,240 156,233 150,229 157,229" fill="#ffffff"/>
    <text x="160" y="249" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff">GPN</text>
  </g>

  <!-- Bottom Helper Text -->
  <text x="160" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">SATU QRIS UNTUK SEMUA PEMBAYARAN</text>
</svg>
