<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Outer Gold Hexagon / Octagon Emblem Border -->
  <circle cx="80" cy="80" r="74" stroke="#c9a84c" stroke-width="2.5" opacity="0.6"/>
  <circle cx="80" cy="80" r="70" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="80" cy="80" r="66" fill="#0d1824" stroke="#c9a84c" stroke-width="2"/>
  
  <!-- Mosque Dome Architecture -->
  <path d="M48 88 Q48 56 80 40 Q112 56 112 88 Z" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 88 Q58 64 80 50 Q102 64 102 88 Z" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Central Arch Door -->
  <path d="M72 88 V74 Q72 68 80 68 Q88 68 88 74 V88" fill="none" stroke="#facc15" stroke-width="2"/>
  
  <!-- Crescent & Star on Top -->
  <path d="M80 34 A4.5 4.5 0 0 1 82 25 A5.5 5.5 0 1 0 80 34 Z" fill="#facc15"/>
  <polygon points="80,22 81,24 83,24 81.5,25.5 82,27.5 80,26 78,27.5 78.5,25.5 77,24 79,24" fill="#facc15"/>
  
  <!-- Minarets Left and Right -->
  <path d="M42 88 V66 L44 64 L46 66 V88" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <path d="M118 88 V66 L116 64 L114 66 V88" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <circle cx="44" cy="62" r="1.5" fill="#facc15"/>
  <circle cx="116" cy="62" r="1.5" fill="#facc15"/>
  
  <!-- Base lines -->
  <line x1="38" y1="88" x2="122" y2="88" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Text: MASJID TERASKOTA -->
  <text x="80" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="2">MASJID</text>
  <text x="80" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#facc15" letter-spacing="1.5">TERASKOTA</text>
  
  <!-- Small Star Accents -->
  <circle cx="48" cy="110" r="1.5" fill="#c9a84c"/>
  <circle cx="112" cy="110" r="1.5" fill="#c9a84c"/>
</svg>
